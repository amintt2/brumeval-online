<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brumeval Online — bac à sable UI</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
      /* stand-in for the 3D canvas so translucent panels can be judged against a "game" scene */
      #game {
        position: fixed; inset: 0; width: 100%; height: 100%; display: block;
        background:
          radial-gradient(ellipse 60% 30% at 30% 72%, rgba(40, 70, 30, 0.9), transparent 70%),
          radial-gradient(ellipse 40% 22% at 75% 78%, rgba(30, 60, 26, 0.9), transparent 70%),
          radial-gradient(circle at 78% 18%, rgba(255, 240, 200, 0.55), transparent 9%),
          linear-gradient(180deg, #7fa6c9 0%, #b9cfd9 38%, #cfd8c4 47%, #6d8f4c 52%, #4d7236 70%, #3a5a29 100%);
      }
      #game::after {
        content: ''; position: absolute; left: 0; right: 0; top: 44%; height: 12%;
        background: linear-gradient(180deg, transparent, rgba(230, 236, 240, 0.55), transparent);
        filter: blur(6px);
      }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }

      /* sandbox drawer (not part of the game UI) */
      #sb {
        position: fixed; top: 50%; right: 0; transform: translateY(-50%); z-index: 1000;
        display: flex; align-items: center; font: 12px/1.3 'Segoe UI', system-ui, sans-serif; color: #eee;
      }
      #sb-toggle {
        writing-mode: vertical-rl; padding: 10px 5px; cursor: pointer; border: 1px solid #555; border-right: none;
        background: #1d2230; color: #ffd98a; border-radius: 6px 0 0 6px; font-weight: 700; letter-spacing: 0.1em;
      }
      #sb-panel {
        display: none; width: 250px; max-height: 92vh; overflow: auto; padding: 8px 10px 10px;
        background: rgba(18, 21, 30, 0.97); border: 1px solid #555; border-right: none; box-shadow: -6px 0 20px rgba(0, 0, 0, 0.5);
      }
      #sb.open #sb-panel { display: block; }
      #sb h4 { margin: 10px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #9ab; }
      #sb h4:first-child { margin-top: 0; }
      #sb .row { display: flex; flex-wrap: wrap; gap: 4px; }
      #sb button {
        font: inherit; padding: 4px 7px; border-radius: 4px; border: 1px solid #4a5570; background: #2a3247; color: #eef;
        cursor: pointer;
      }
      #sb button:hover { background: #3a4563; }
      #sb label { display: flex; gap: 6px; align-items: center; margin-top: 4px; cursor: pointer; }
      #sb .keys { margin-top: 8px; color: #8a94a8; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-root"></div>
    <div id="sb">
      <div id="sb-toggle" title="Bac à sable (touche ²/`)">SANDBOX</div>
      <div id="sb-panel"></div>
    </div>
    <script type="module" src="/src/ui/sandbox.js"></script>
  </body>
</html>
