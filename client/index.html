<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brumeval Online — MMORPG multijoueur dans votre navigateur." />
    <meta name="theme-color" content="#0b0d12" />
    <title>Brumeval Online</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 56 16v18c0 14-10 23-24 26C18 57 8 48 8 34V16z' fill='%23231a10' stroke='%23d9a441' stroke-width='4'/%3E%3Cpath d='M32 14v34M22 24h20' stroke='%23f2d27a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; contain: strict; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 99;
        background: #0b0d12; color: #e9dcc0; font: 16px/1.5 Georgia, serif; text-align: center; padding: 24px; }
      #fatal b { display: block; font-size: 22px; color: #f2d27a; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>
    <div id="labels"></div>
    <div id="ui-root"></div>
    <div id="fatal"><div><b>Brumeval Online</b><span id="fatal-msg"></span></div></div>
    <noscript><p style="color:#eee;font-family:sans-serif;padding:24px">Brumeval Online nécessite JavaScript.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
