<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Brumeval Online — blason (source des icônes du launcher et de la PWA). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="0.55" stop-color="#161b29"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.35" stop-color="#e6bd5c"/>
      <stop offset="0.7" stop-color="#b8862f"/>
      <stop offset="1" stop-color="#7a5418"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5f1c"/>
      <stop offset="0.5" stop-color="#f6db8a"/>
      <stop offset="1" stop-color="#8a5f1c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4f"/>
      <stop offset="1" stop-color="#1a1224"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb3c8"/>
      <stop offset="0.5" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#7d8fa6"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8d4e8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d7ecf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b8d4e8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="inner"><circle cx="512" cy="512" r="426"/></clipPath>
  </defs>

  <!-- médaillon -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="468" fill="url(#gold)"/>
    <circle cx="512" cy="512" r="440" fill="#1b1409"/>
    <circle cx="512" cy="512" r="426" fill="url(#bg)"/>
  </g>
  <!-- rivets -->
  <g fill="url(#goldH)">
    <circle cx="512" cy="62" r="14"/><circle cx="512" cy="962" r="14"/>
    <circle cx="62" cy="512" r="14"/><circle cx="962" cy="512" r="14"/>
    <circle cx="194" cy="194" r="11"/><circle cx="830" cy="194" r="11"/>
    <circle cx="194" cy="830" r="11"/><circle cx="830" cy="830" r="11"/>
  </g>

  <!-- montagnes et brume -->
  <g clip-path="url(#inner)">
  <path d="M60 760 L60 700 L300 470 L390 560 L512 400 L640 560 L730 480 L964 700 L964 760 Z" fill="#232c42"/>
  <path d="M300 470 L340 520 L318 518 L300 540 L284 512 Z M512 400 L560 460 L530 456 L512 480 L494 456 L468 462 Z M730 480 L770 528 L746 524 L730 544 Z" fill="#dfe8f2" opacity="0.8"/>
  <path d="M60 720 C260 680 360 740 512 710 C664 680 780 740 964 712 L964 960 L60 960 Z" fill="url(#mist)" opacity="0.55"/>
  </g>

  <!-- bouclier -->
  <g filter="url(#shadow)">
    <path d="M512 196 L742 280 L742 520 C742 670 640 780 512 842 C384 780 282 670 282 520 L282 280 Z" fill="url(#gold)"/>
    <path d="M512 226 L714 300 L714 520 C714 652 624 750 512 808 C400 750 310 652 310 520 L310 300 Z" fill="url(#shield)"/>
  </g>
  <!-- lune -->
  <circle cx="512" cy="330" r="46" fill="#f2d27a" opacity="0.25" filter="url(#glow)"/>
  <path d="M530 290 A46 46 0 1 0 540 372 A38 38 0 1 1 530 290 Z" fill="#f6dc8e"/>

  <!-- épée -->
  <g>
    <path d="M512 250 L536 300 L536 690 L512 730 L488 690 L488 300 Z" fill="url(#blade)" stroke="#2b3142" stroke-width="6" stroke-linejoin="round"/>
    <path d="M512 262 L512 715" stroke="#6f809a" stroke-width="5" opacity="0.7"/>
    <rect x="404" y="664" width="216" height="40" rx="20" fill="url(#goldH)" stroke="#5a3d0f" stroke-width="6"/>
    <rect x="494" y="700" width="36" height="104" rx="12" fill="#4a2e1a" stroke="#2a190c" stroke-width="6"/>
    <path d="M494 724 L530 740 M494 754 L530 770 M494 784 L530 798" stroke="#7a4d2b" stroke-width="6"/>
    <circle cx="512" cy="826" r="26" fill="url(#gold)" stroke="#5a3d0f" stroke-width="6"/>
    <circle cx="404" cy="684" r="14" fill="#c2413b"/><circle cx="620" cy="684" r="14" fill="#c2413b"/>
  </g>

  <!-- volutes de brume devant l'épée -->
  <path d="M330 590 C410 560 450 610 512 588 C574 566 620 612 694 584" fill="none" stroke="#d7ecf8" stroke-width="16" stroke-linecap="round" opacity="0.55"/>
  <path d="M350 634 C420 612 470 650 530 632 C590 614 630 646 676 630" fill="none" stroke="#d7ecf8" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
</svg>
